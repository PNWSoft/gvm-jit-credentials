name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    name: PowerShell (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Windows PowerShell 5.1 is the deployment runtime and parses differently from 7.x --
        # constructs that are fine in pwsh can fail there. Both must pass.
        shell: [powershell, pwsh]
    # Set here, NOT as `shell:` on each step. A step's `shell` key accepts no contexts at all, so
    # `shell: ${{ matrix.shell }}` on a step makes the whole workflow file invalid -- every run fails
    # in 0 seconds with no jobs and only "likely failed because of a workflow file issue" to go on.
    # jobs.<id>.defaults.run DOES allow the matrix context, and the steps inherit it.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse every script
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1 | Sort-Object FullName | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) {
              $bad++
              Write-Host "FAIL $($_.FullName):$($e[0].Extent.StartLineNumber) $($e[0].Message)"
            }
          }
          Write-Host "$($PSVersionTable.PSVersion) -- $bad file(s) failed to parse"
          if ($bad -gt 0) { exit 1 }

      - name: Validate module manifest
        run: |
          $m = Test-ModuleManifest ./GvmJitCredential/GvmJitCredential.psd1
          Write-Host "$($m.Name) v$($m.Version): $($m.ExportedFunctions.Keys -join ', ')"

      - name: Import module (no RSAT on the runner -- must still load)
        run: |
          Import-Module ./GvmJitCredential/GvmJitCredential.psd1 -Force
          $n = (Get-Command -Module GvmJitCredential).Count
          if ($n -ne 5) { throw "expected 5 exported functions, got $n" }
          Write-Host "imported OK with $n exported functions"

      - name: Pester
        run: |
          # Pinned below 6. Pester 6 requires PowerShell 7, so on the Windows PowerShell 5.1 leg
          # `-MinimumVersion 5.5.0` alone can resolve a version that cannot load at all -- verified
          # locally: installing it that way under 5.1 gave Pester 6.2.0, and Import-Module then failed
          # with "the module could not be loaded". This run only passed because the hosted image happens
          # to ship a 5.x as well, which is not something to depend on.
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force
          Write-Host "Pester $((Get-Module Pester).Version) on PowerShell $($PSVersionTable.PSVersion)"
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  analyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -Settings ./PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; throw "$($r.Count) issue(s)" }
          Write-Host 'PSScriptAnalyzer clean'

  hygiene:
    name: Hygiene (shellcheck, CRLF, no leaked config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck && shellcheck host/*.sh

      - name: PowerShell files must be CRLF
        # signtool eats the last line of an LF-only .ps1, producing a signed file that reports
        # Status: Valid and then fails to parse. .gitattributes enforces this on checkout; this
        # step makes a regression a build failure rather than a mystery months later.
        run: |
          # Checking the ATTRIBUTE, not the checked-out bytes. `text eol=crlf` forces CRLF on
          # checkout on every platform, so inspecting the working tree can only ever say "yes" --
          # the previous version of this gate could not fail. What can regress is a PowerShell file
          # that is not covered by the attribute, or an index entry with mixed endings.
          bad=0
          while IFS= read -r f; do
            attr=$(git check-attr eol -- "$f" | sed 's/.*: //')
            if [ "$attr" != "crlf" ]; then echo "eol attribute is '$attr', expected 'crlf': $f"; bad=1; fi
          done < <(git ls-files '*.ps1' '*.psm1' '*.psd1')
          if git ls-files --eol -- '*.ps1' '*.psm1' '*.psd1' | grep -q 'i/mixed'; then
            echo 'index contains mixed line endings:'
            git ls-files --eol -- '*.ps1' '*.psm1' '*.psd1' | grep 'i/mixed'
            bad=1
          fi
          [ "$bad" -eq 0 ] || { echo 'PowerShell files must be covered by eol=crlf; see .gitattributes'; exit 1; }

      - name: Files bound for the Linux scanner must be LF
        # Same reasoning in the other direction, and with a sharper failure. Everything under host/ is
        # copied to the scanner, and gmp.env.example becomes .gmp.env, which the relay SOURCES with
        # /bin/sh as root. Measured on Ubuntu (/bin/sh -> dash): a CRLF file yields values with a
        # trailing carriage return, quoted or not, so the credentials fail to authenticate while looking
        # perfectly correct in an editor. The attribute is what must hold, for the same reason as above:
        # the checked-out bytes cannot disagree with it.
        run: |
          bad=0
          while IFS= read -r f; do
            attr=$(git check-attr eol -- "$f" | sed 's/.*: //')
            if [ "$attr" != "lf" ]; then echo "eol attribute is '$attr', expected 'lf': $f"; bad=1; fi
          done < <(git ls-files 'host/*')
          [ "$bad" -eq 0 ] || { echo 'Files under host/ must be covered by eol=lf; see .gitattributes'; exit 1; }
          echo 'clean'

      - name: No environment-specific values committed
        run: |
          # Patterns are deliberately GENERIC. An earlier version of this gate listed the maintainer's
          # actual addresses, hostname and account names inline, and excluded itself from its own search
          # so it would not fail -- which meant the control against publishing those values published
          # them. A leak gate must not be a leak.
          #
          # The documented examples this repo DOES use are allowed by name: the 10.0.0.x subnet, the
          # EXAMPLE/example.local domain, and scanner.example.local. Anything else that looks like a real
          # environment fails, which is the right default for a public sample.
          FILES="*.ps1 *.psm1 *.psd1 *.sh *.md *.yml"
          bad=0

          # RFC1918 addresses other than the 10.0.0.x used in the examples.
          if git grep -inE '(192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|10\.(([1-9][0-9]*\.)|0\.([1-9][0-9]*\.)))' -- $FILES; then
            echo '^ private IP address that is not the documented 10.0.0.x example'; bad=1
          fi

          # An AD domain component that is not the example one. Filtered with a second grep rather than a
          # negative lookahead, so this does not depend on git being built with PCRE -- and matched per
          # TOKEN, not per line, because a real domain written beside the allowed one (as in
          # "DC=<yours>,DC=local") sits on a line that contains an allowed token, and filtering whole
          # lines would let it through. Verified against exactly that input.
          #
          # This step scans '*.yml', so it scans ITSELF. That is deliberate -- it is what stops a real
          # value being parked in the gate's own patterns -- and it is why nothing here spells out a
          # concrete domain, address or account name, not even in a comment.
          offenders=$(git grep -ohE 'DC=[A-Za-z0-9-]+' -- $FILES | sort -u | grep -viE '^DC=(EXAMPLE|local)$' || true)
          if [ -n "$offenders" ]; then
            echo "AD domain other than EXAMPLE: $offenders"
            for t in $offenders; do git grep -inF "$t" -- $FILES || true; done
            bad=1
          fi

          # Optional: the maintainer's own values, supplied as a repo secret so they are checked without
          # being committed. Absent (forks, first clone) the generic checks above still apply.
          if [ -n "${{ secrets.FORBIDDEN_VALUE_PATTERN }}" ]; then
            if git grep -inE "${{ secrets.FORBIDDEN_VALUE_PATTERN }}" -- $FILES; then
              echo '^ matches the private forbidden-value pattern'; bad=1
            fi
          fi

          [ "$bad" -eq 0 ] || { echo 'Environment-specific values must not be committed'; exit 1; }
          echo 'clean'
